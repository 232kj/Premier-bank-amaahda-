<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premier Bank - Codsiga Amaahda</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --bank-primary: #002D62;
            --bank-hover: #001f3f;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #001f3f;
            --text-muted: #888888;
            --input-border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Header Navigation bar */
        .app-header {
            width: 100%;
            background-color: var(--bank-primary);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            font-size: 20px;
            font-weight: 800;
            color: white;
        }

        .header-title .premier { color: white; margin-right: 4px; }
        .header-title .bank { color: #4da6ff; }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: white;
            border-radius: 2px;
        }

        /* Card Layout */
        .card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 45, 98, 0.08);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 24px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        /* Step Progress Bar */
        .step-indicator {
            display: flex;
            justify-content: space-center;
            gap: 12px;
            margin: 0 auto 32px;
            width: 80%;
        }

        .step-bar {
            flex: 1;
            height: 4px;
            background-color: #cbd5e1;
            border-radius: 2px;
        }

        .step-bar.active {
            background-color: var(--bank-primary);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 10px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #333333;
            outline: none;
            width: 100%;
        }

        .form-control:focus {
            border-color: var(--bank-primary);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23555555' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 14px;
            padding-right: 40px;
            cursor: pointer;
        }

        textarea.form-control {
            resize: none;
            height: 95px;
            font-family: inherit;
        }

        .btn-next {
            background-color: var(--bank-primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            margin-top: 15px;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        .btn-next:hover {
            background-color: var(--bank-hover);
        }

        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666666;
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- Header Navigation Bar -->
<div class="app-header">
    <a href="/" class="back-btn">← Dib u laabo</a>
    <div class="header-title">
        <span class="premier">Premier</span><span class="bank">Bank</span>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">Codsiga Amaahda</h1>
    <div class="subtext">Tallaabada 1 ee 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <!-- Application Form -->
    <form id="loanForm" onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">Nooca Amaahda</label>
            <select id="loanType" class="form-control" required>
                <option value="Amaah Shakhsi ah" selected>Amaah Shakhsi ah</option>
                <option value="Amaah Ganacsi">Amaah Ganacsi</option>
                <option value="Amaah Waxbarasho">Amaah Waxbarasho</option>
                <option value="Amaah Degdeg ah">Amaah Degdeg ah</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmt">Lacagta Amaahda (USD)</label>
            <input type="number" id="loanAmt" class="form-control" placeholder="1000" value="1000" required>
        </div>

        <div class="form-group">
            <label for="loanTerm">Muddada Amaahda</label>
            <select id="loanTerm" class="form-control" required>
                <option value="3 Bilood">3 Bilood</option>
                <option value="6 Bilood">6 Bilood</option>
                <option value="12 Bilood" selected>12 Bilood</option>
                <option value="24 Bilood">24 Bilood</option>
                <option value="36 Bilood">36 Bilood</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanPurpose">Ujeedada Amaahda</label>
            <textarea id="loanPurpose" class="form-control" placeholder="Maxaa loogu talagalay amaahdan?" required></textarea>
        </div>

        <button type="submit" class="btn-next">TALLAABADA XIGTA</button>
    </form>
</div>

<!-- Footer -->
<div class="footer-banner">
    © 2026 Premier Bank Somalia
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const savedAmount = localStorage.getItem('loan_amount') || localStorage.getItem('amount');
        const savedDuration = localStorage.getItem('loan_term') || localStorage.getItem('duration');

        if (savedAmount) {
            const digitsOnly = savedAmount.toString().replace(/\D/g, '');
            if (digitsOnly) {
                document.getElementById('loanAmt').value = digitsOnly;
            }
        }
    };

    function submitStep1(event) {
        event.preventDefault();

        const loanType = document.getElementById('loanType').value;
        const loanAmt = Number(document.getElementById('loanAmt').value) || 0;
        const loanTermVal = document.getElementById('loanTerm').value;
        const loanPurpose = document.getElementById('loanPurpose').value;

        const months = Number(loanTermVal.replace(/\D/g, '')) || 12;

        const annualRate = 0.05;
        const totalInterest = loanAmt * annualRate * (months / 12);
        const monthlyPayment = Math.round((loanAmt + totalInterest) / months);

        localStorage.setItem('loan_amount', loanAmt);
        localStorage.setItem('amount', loanAmt);
        localStorage.setItem('appliedAmount', loanAmt);

        localStorage.setItem('loan_term', months);
        localStorage.setItem('duration', months);
        localStorage.setItem('appliedTerm', loanTermVal);

        localStorage.setItem('monthly_repayment', monthlyPayment);
        localStorage.setItem('appliedLoanType', loanType);
        localStorage.setItem('appliedPurpose', loanPurpose);

        window.location.href = "/page3"; 
    }
</script>

</body>
</html>
